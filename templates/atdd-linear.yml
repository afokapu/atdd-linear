# Generated by @afokapu/atdd-linear. Keeps the repository's Linear team in line with plan/ on every
# merge to main, with WMBT status taken from the test run. Needs the repository secret LINEAR_API_KEY.
name: atdd-linear
on:
  push:
    branches: [main]
concurrency: atdd-linear
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # a version's release notes diff plan/ across its week
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test --reporter=junit --reporter-outfile=atdd-linear.junit.xml || true
      - run: bunx atdd-linear sync --apply --results atdd-linear.junit.xml
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
